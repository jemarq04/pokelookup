[package]
name = "pokelookup"
description = "Look up pokemon details through PokeAPI."
authors = ["Justin Marquez"]
version = "1.5.3"
edition = "2024"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jemarq04/pokelookup"
repository = "https://github.com/jemarq04/pokelookup"
keywords = ["pokemon", "pokeapi", "pokedex"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
itertools = "0.15.0"
open = { version = "5.4.5", optional = true }
rustemon = "=4.8.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
ureq = "3.5.0"

[features]
default = ["clap/wrap_help"]
web = ["dep:open"]
